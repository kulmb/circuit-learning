name: circuits-de-zap

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    environment:
      MONGO_REPLICA_HOST: mongo:27017
    # Only bound to the host loopback, for migrations, seeds and mongosh.
    # The API talks to mongo:27017 over the compose network.
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo-data:/data/db
      - ./deploy/mongo/replica-healthcheck.sh:/usr/local/bin/replica-healthcheck:ro
    healthcheck:
      test: ["CMD", "bash", "/usr/local/bin/replica-healthcheck"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: circuits-api:local
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3100"
      MONGODB_URI: mongodb://mongo:27017/circuits?replicaSet=rs0
    ports:
      - "127.0.0.1:3100:3100"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3100/api/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mongo-data:
